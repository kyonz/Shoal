# The smallest Shoal workflow: no model, sandbox or connection needed.
#   awm apply -f examples/hello/ && awm run hello -i name=Dana --wait
apiVersion: awm.dev/v1
kind: Workflow
metadata:
  name: hello
  description: Says hello. Use it to check that a fresh server runs workflows.
spec:
  inputs:
    name: {type: string}
  outputs:
    greeting: "{{ steps.greet.output.text }}"
  steps:
    - id: greet
      type: set
      values: {text: "Hello {{ inputs.name }}"}
