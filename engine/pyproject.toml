[project]
name = "shoal"
version = "0.1.0"
description = "Shoal: an open-source, multi-tenant engine for multi-agent AI workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Shoal contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Framework :: Pydantic :: 2",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "croniter>=2.0",
  "cryptography>=42",
  "anthropic>=0.40",
  "sse-starlette>=2.1",
  "pyjwt[crypto]>=2.8",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
kubernetes = ["kubernetes-asyncio>=30.1"]
e2b = ["e2b>=1.0"]
docker = ["docker>=7.1"]
temporal = ["temporalio>=1.20"]
jev = ["typesafe-sdk>=0.7"]
all = ["shoal[postgres,kubernetes,e2b,docker,temporal,jev]"]

[project.scripts]
shoal = "shoal.cli.main:app"

[project.entry-points."shoal.sandboxes"]
local = "shoal.sandbox.local:LocalBackend"
docker = "shoal.sandbox.docker:DockerBackend"
kubernetes = "shoal.sandbox.kubernetes:KubernetesBackend"
e2b = "shoal.sandbox.e2b:E2BBackend"
space = "shoal.sandbox.space:SpaceBackend"
remote = "shoal.sandbox.remote:RemoteBackend"

[project.entry-points."shoal.integrations"]
github = "shoal.integrations.github:GitHubIntegration"
jira = "shoal.integrations.jira:JiraIntegration"
webhook = "shoal.integrations.webhook:WebhookIntegration"
remote = "shoal.integrations.remote:RemoteIntegration"
mcp = "shoal.integrations.mcp:McpIntegration"
slack = "shoal.integrations.slack:SlackIntegration"

[project.entry-points."shoal.providers"]
anthropic = "shoal.agents.providers.anthropic:AnthropicProvider"
scripted = "shoal.agents.providers.scripted:ScriptedProvider"
openai-compatible = "shoal.agents.providers.openai_compat:OpenAICompatibleProvider"
claude-code = "shoal.agents.claude_code:ClaudeCodeGatewayProvider"

[project.entry-points."shoal.decision_providers"]
llm = "shoal.decisions.llm:LLMDecisionProvider"
jev = "shoal.decisions.jev:JevProvider"

[project.entry-points."shoal.eval_sinks"]
braintrust = "shoal.evals.sinks.braintrust:BraintrustSink"
langfuse = "shoal.evals.sinks.langfuse:LangfuseSink"

[project.entry-points."shoal.skill_sources"]
git = "shoal.skills.git:GitSkillSource"
registry = "shoal.skills.registry:RegistrySkillSource"

[project.entry-points."shoal.agent_runtimes"]
tool-loop = "shoal.agents.tool_loop:ToolLoopRuntime"
cli = "shoal.agents.cli_runtime:CliRuntime"
a2a = "shoal.agents.a2a_runtime:A2ARuntime"
claude-code = "shoal.agents.claude_code:ClaudeCodeRuntime"

[project.entry-points."shoal.orchestrators"]
builtin = "shoal.runtime.orchestrator:BuiltinOrchestrator"
temporal = "shoal.runtime.temporal.orchestrator:TemporalOrchestrator"

[project.entry-points."shoal.dispatch_queues"]
database = "shoal.runtime.queues:DatabaseQueue"
sqs = "shoal.runtime.queues.sqs:SQSQueue"

[project.entry-points."shoal.credentials"]
aws = "shoal.cloud.aws:AwsProvider"

[project.entry-points."shoal.secrets"]
env = "shoal.secrets.providers:EnvSecretProvider"
db = "shoal.secrets.providers:DatabaseSecretProvider"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shoal"]

[tool.hatch.build.targets.wheel.force-include]
"../templates/integration" = "shoal/sdk/_template"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109"]
