{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.url) }}
{{- fail "set database.url (an external Postgres) or postgresql.enabled=true" }}
{{- end }}
{{- $name := include "shoal.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $secretKey := .Values.secrets.secretKey | default ((get $data "SHOAL_SECRET_KEY") | default "" | b64dec) | default (randAlphaNum 48) }}
{{- $adminToken := .Values.secrets.adminToken | default ((get $data "SHOAL_ADMIN_TOKEN") | default "" | b64dec) | default (randAlphaNum 40) }}
{{- $pgPassword := .Values.postgresql.auth.password | default ((get $data "POSTGRES_PASSWORD") | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoal.labels" . | nindent 4 }}
type: Opaque
data:
  SHOAL_SECRET_KEY: {{ $secretKey | b64enc | quote }}
  SHOAL_ADMIN_TOKEN: {{ $adminToken | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  {{- $auth := printf "postgresql+asyncpg://%s:%s" (.Values.postgresql.auth.username | urlquery) ($pgPassword | urlquery) }}
  {{- $direct := printf "%s@%s:5432/%s" $auth (include "shoal.postgresql.fullname" .) .Values.postgresql.auth.database }}
  {{- if .Values.pgbouncer.enabled }}
  SHOAL_DATABASE_URL: {{ printf "%s@%s:5432/%s" $auth (include "shoal.pgbouncer.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}
  SHOAL_DATABASE_DIRECT_URL: {{ $direct | b64enc | quote }}
  {{- else }}
  SHOAL_DATABASE_URL: {{ $direct | b64enc | quote }}
  {{- end }}
  {{- else }}
  SHOAL_DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- with .Values.database.directUrl }}
  SHOAL_DATABASE_DIRECT_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
