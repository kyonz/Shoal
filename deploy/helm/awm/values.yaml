# Default values for the awm chart.

image:
  repository: ghcr.io/kyonz/ai-workflow-manager
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Server settings, passed as AWM_* environment variables to every pod.
config:
  # External base URL: webhook URLs, A2A agent cards and OIDC redirects use it.
  publicUrl: "http://localhost:8080"
  corsOrigins: []
  defaultSandboxBackend: local
  defaultDecisionProvider: llm
  workerConcurrency: 16
  leaseSeconds: 60
  logLevel: INFO
  logJson: true

# Credentials. Leave secretKey/adminToken empty to generate them once (they are
# kept across upgrades), or point existingSecret at a Secret you manage with keys
# AWM_SECRET_KEY, AWM_ADMIN_TOKEN and, when the database is external,
# AWM_DATABASE_URL.
secrets:
  existingSecret: ""
  secretKey: ""
  adminToken: ""

# External database. Ignored when postgresql.enabled is true.
database:
  # e.g. postgresql+asyncpg://awm:password@db.example.com:5432/awm
  url: ""

# A single-instance Postgres for evaluation and small installs. Use a managed
# or operator-run database in production and set database.url instead.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: awm
    database: awm
    # Generated once when empty.
    password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Extra environment for every Shoal pod (model provider keys, sandbox services, ...).
extraEnv: []
#  - name: ANTHROPIC_API_KEY
#    valueFrom: {secretKeyRef: {name: llm-keys, key: anthropic}}
extraEnvFrom: []

serviceAccount:
  create: true
  name: ""
  # Annotations for workload identity (e.g. eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account).
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

api:
  replicaCount: 2
  # Also run a worker inside each API pod (small installs can then set worker.enabled=false).
  embeddedWorker: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

worker:
  enabled: true
  replicaCount: 2
  # Fire schedules and campaign ticks (leases keep this exactly-once across workers).
  scheduler: true
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Scratch space for 'local' sandboxes.
  sandboxVolume:
    sizeLimit: 10Gi
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: awm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: awm-tls
  #    hosts: [awm.example.com]

# Let workers run sandboxes as pods ('kubernetes' sandbox backend).
kubernetesSandboxes:
  enabled: false
  # Namespaces sandboxes run in (the profile's 'namespace'). Roles are created in each.
  namespaces: [awm-sandboxes]
  createNamespaces: true
  # Use a ClusterRole instead, e.g. for per-tenant namespaces like 'awm-{tenant}'.
  clusterWide: false

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
