{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "awm.fullname" . }}-worker
  labels:
    {{- include "awm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "awm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "awm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "awm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Runs in flight are leased; a stopped worker's runs resume elsewhere once
      # the lease expires, so a grace period only needs to cover the current step.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      initContainers:
        # The API creates the schema on start; wait for it rather than racing it.
        - name: wait-for-api
          image: {{ include "awm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import time, urllib.request
              url = "http://{{ include "awm.fullname" . }}:{{ .Values.service.port }}/readyz"
              while True:
                  try:
                      urllib.request.urlopen(url, timeout=3)
                      break
                  except Exception as exc:
                      print(f"waiting for {url}: {exc}", flush=True)
                      time.sleep(3)
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      containers:
        - name: worker
          image: {{ include "awm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"{{ if not .Values.worker.scheduler }}, "--no-scheduler"{{ end }}]
          env:
            {{- include "awm.env" . | nindent 12 }}
          envFrom:
            {{- include "awm.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "awm.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "awm.volumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
