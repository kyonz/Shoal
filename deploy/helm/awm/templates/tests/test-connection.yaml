apiVersion: v1
kind: Pod
metadata:
  name: {{ include "awm.fullname" . }}-test
  labels:
    {{- include "awm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      image: {{ include "awm.image" . }}
      command: ["python", "-c", "import urllib.request; print(urllib.request.urlopen('http://{{ include "awm.fullname" . }}:{{ .Values.service.port }}/readyz', timeout=5).read())"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
