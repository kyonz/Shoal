apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "awm.fullname" . }}
  labels:
    {{- include "awm.labels" . | nindent 4 }}
data:
  AWM_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  AWM_CORS_ORIGINS: {{ (.Values.config.corsOrigins | default (list .Values.config.publicUrl)) | toJson | quote }}
  AWM_DEFAULT_SANDBOX_BACKEND: {{ .Values.config.defaultSandboxBackend | quote }}
  AWM_DEFAULT_DECISION_PROVIDER: {{ .Values.config.defaultDecisionProvider | quote }}
  AWM_WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  AWM_LEASE_SECONDS: {{ .Values.config.leaseSeconds | quote }}
  AWM_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AWM_LOG_JSON: {{ .Values.config.logJson | quote }}
