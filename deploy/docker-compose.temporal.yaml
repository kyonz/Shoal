# Try the Temporal orchestrator against a throwaway Temporal dev server:
#
#   docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.temporal.yaml up -d --build
#
# The Temporal UI is on http://localhost:8233 (each Shoal run is a workflow named
# shoal-run-<run id>). The dev server keeps its state in memory; for real use point
# SHOAL_TEMPORAL_ADDRESS at your own cluster instead of adding this file.

services:
  temporal:
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8233"

  api:
    environment:
      SHOAL_ORCHESTRATOR: temporal
      SHOAL_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started

  worker:
    environment:
      SHOAL_ORCHESTRATOR: temporal
      SHOAL_TEMPORAL_ADDRESS: temporal:7233
