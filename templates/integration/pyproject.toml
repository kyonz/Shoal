[project]
name = "awm-starter"
version = "0.1.0"
description = "Starter integration for Shoal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["awm>=0.1", "httpx>=0.27", "pydantic>=2.7"]

# This is what makes Shoal discover the integration: install the package next to
# the engine and `starter` appears in the integrations catalogue.
[project.entry-points."awm.integrations"]
starter = "awm_starter:StarterIntegration"

# Until awm is published, install it from the repository.
[tool.uv.sources]
awm = { git = "https://github.com/kyonz/ai-workflow-manager", subdirectory = "engine" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awm_starter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
